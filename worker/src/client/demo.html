<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SMS Verify 演示页</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0b0d11; color: #e8ecf3; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .box { max-width: 460px; padding: 30px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #8b95a5; font-size: 13.5px; }
  button { margin-top: 18px; padding: 14px 30px; font-size: 17px; font-weight: 700; color: #fff;
           background: #30a05c; border: 0; border-radius: 10px; cursor: pointer; }
  .log { margin-top: 22px; padding: 12px; background: #14171d; border: 1px solid #262c37;
         border-radius: 9px; font: 12px/1.6 ui-monospace, Menlo, monospace; color: #8b95a5;
         text-align: left; max-height: 220px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="box">
  <h1>AI Crypto Signal Group</h1>
  <p>这是演示页：点击按钮会弹出手持验证弹窗，验证通过后跳转到 WhatsApp。</p>
  <button onclick="gotolink(nbgoto)">Join Group</button>
  <div class="log" id="log">事件日志：</div>
</div>

<script>
  // 模拟你落地页里现有的配置
  // 测试小技巧：加 ?link=<url> 可把跳转目标临时指向本地，方便本地联调
  var testLink = new URLSearchParams(location.search).get('link');
  var nbgoto = testLink ? [testLink] : [
    'https://chat.whatsapp.com/LWdZaaSfHBZBsnkVInwOh7',
    'https://chat.whatsapp.com/DYXf8zL4ZWRH7GjgENXYse'
  ];
  var expTime = 60 * 60 * 0;

  function gotolink(urls) {
    if (!urls) { alert('no link'); return; }
    var gotourl = urls[Math.floor(Math.random() * urls.length)];
    window.open(gotourl);
  }
</script>

<!-- SMS Verify 接入：正式接入时把 apiBase 换成你的 Worker 域名 -->
<script>
  window.SMS_VERIFY_CONFIG = {
    apiBase: location.origin,       // 演示用：与 Worker 同源
    site: 'demo',
    failOpen: true,                 // 后端不可用时是否直接放行
  };
  function svlog(name, detail) {
    var box = document.getElementById('log');
    box.textContent += '\n' + new Date().toLocaleTimeString() + '  ' + name + '  ' + JSON.stringify(detail || {});
    box.scrollTop = box.scrollHeight;
  }
  window.SMS_VERIFY_CONFIG.onEvent = svlog;
  ['sms:modal_open', 'sms:sent', 'sms:verified', 'sms:redirect', 'sms:error', 'sms:grant_reused']
    .forEach(function (n) { window.addEventListener(n, function (e) { svlog(n, e.detail); }); });
</script>
<script src="/w.js" async></script>
</body>
</html>
